name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servitor
    steps:
      - uses: actions/checkout@v7
        with:
          path: servitor

      - name: Reject tracked private workspace files
        shell: bash
        run: |
          tracked_private=$(git ls-files -- Memory/ knowledge/ Work/)
          if [ -n "$tracked_private" ]; then
            printf '%s\n' 'Private workspace files must not be tracked:' "$tracked_private"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servitor
    steps:
      - uses: actions/checkout@v7
        with:
          path: servitor
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servitor
    steps:
      - uses: actions/checkout@v7
        with:
          path: servitor
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servitor
    steps:
      - uses: actions/checkout@v7
        with:
          path: servitor
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
